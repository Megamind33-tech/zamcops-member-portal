# ZAMCOPS Member Portal — self-hosted stack for a single VPS.
#
#   cp .env.example .env     # fill in AUTH_SECRET, POSTGRES_PASSWORD, ADMIN_*, PORTAL_DOMAIN
#   docker compose up -d --build
#
# Three containers: the portal, PostgreSQL, and Caddy for HTTPS (Caddy obtains
# and renews a Let's Encrypt certificate on its own). Member uploads and the
# database both live on named volumes — back those two up and you have backed up
# the portal.
#
# To run without Caddy (behind an existing nginx, or to try it on localhost),
# start just the two services:  docker compose up -d app db

# Pinned so the volumes are always named zamcops_db-data / zamcops_uploads,
# whatever the checkout directory is called. The backup commands in the README
# reference those names — without this they follow the directory and a rename
# makes them silently back up nothing.
name: zamcops

# Defaults applied to every service below. Docker's json-file driver does not
# rotate on its own, and an unbounded log on a VPS that hosts other apps fills
# the disk for all of them, not just this one.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zamcops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-zamcops}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zamcops} -d ${POSTGRES_DB:-zamcops}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Postgres is the process you least want OOM-killed on a shared box: losing
    # it takes the portal down and risks the members' register. Give it a floor
    # the kernel will respect, and a ceiling so it cannot crowd out neighbours.
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-1g}
    # Not published: the database is reachable only from the compose network.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    # Sized for a society of this scale. Raise it if PDF generation for a large
    # catalogue starts getting OOM-killed; lower it if the box is tighter.
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-1500m}
    environment:
      # Both point at the same server — there is no pooler in front of a local
      # Postgres, so the runtime and migration URLs are identical.
      DATABASE_URL: postgresql://${POSTGRES_USER:-zamcops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zamcops}
      DIRECT_URL: postgresql://${POSTGRES_USER:-zamcops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zamcops}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_NAME: ${ADMIN_NAME:-ZAMCOPS Staff}
      # Uploads land on the volume mounted below, not in the database.
      LOCAL_STORAGE_DIR: /data/uploads
      # Optional channels — left empty, each one simply stays switched off.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      AT_USERNAME: ${AT_USERNAME:-}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_SENDER_ID: ${AT_SENDER_ID:-}
    volumes:
      - uploads:/data/uploads
    # Published on loopback only: whatever terminates TLS (the caddy service
    # below, or an nginx already on the box) proxies to it; nothing reaches it
    # from outside. Set APP_HOST_PORT when 3000 is already in use on the host —
    # only the host side moves, the container still listens on 3000.
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    # Wait for the app to pass its healthcheck, not merely to start: the first
    # boot syncs the schema, and proxying into that window serves errors to
    # whoever happens to be watching the deploy.
    depends_on:
      app:
        condition: service_healthy
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?set PORTAL_DOMAIN in .env}
      # Let's Encrypt uses this to warn you before a certificate expires.
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
